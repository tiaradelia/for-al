<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 22nd Birthday Al Sayang 🌻</title>
  <style>
    :root {
      --bg-color: #1c150c;
      --card-bg: #2a1f13;
      --accent: #ffc107;
      --accent-spark: #ffe082;
      --text-main: #fff8e1;
      --text-sub: #d7ccc8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Sunflowers & Sparks */
    .floating-item {
      position: fixed;
      top: -20px;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      z-index: 1000;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.1;
      }
    }

    /* Layout Container */
    .mobile-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* Screen 1: Loading */
    #screen-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      text-align: center;
    }

    .flower-spinner {
      font-size: 50px;
      animation: spin 3s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Screen 2: Passcode */
    #screen-passcode {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .pass-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .pass-dots {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .dot.filled {
      background-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .key-btn:active {
      background: rgba(255, 193, 7, 0.3);
    }

    .error-msg {
      color: #ff5555;
      font-size: 12px;
      margin-top: 8px;
      height: 16px;
    }

    /* Screen 3: Gift Box */
    #screen-gift {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      text-align: center;
    }

    .gift-box {
      font-size: 80px;
      margin-top: 20px;
      cursor: pointer;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    /* Main Sections */
    .main-section {
      width: 100%;
      text-align: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .sub-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 5px;
    }

    /* Bouquet */
    .flowers-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 15px 0 10px;
    }

    .flower-item {
      font-size: 32px;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 12px;
    }

    .flower-message {
      min-height: 38px;
      font-size: 13px;
      color: var(--accent-spark);
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Letter */
    .letter-content {
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* Photo Frame */
    .photo-card {
      background: #fff;
      padding: 10px 10px 18px 10px;
      border-radius: 8px;
      color: #333;
      margin-top: 15px;
    }

    .photo-card img {
      width: 100%;
      border-radius: 4px;
      display: block;
      object-fit: cover;
    }

    .photo-caption {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    /* Jar Shake */
    .jar-btn {
      background: var(--accent);
      color: #1c150c;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <div id="item-container"></div>

  <div class="mobile-container">
    
    <div id="screen-loading">
      <div class="flower-spinner">🌻</div>
      <p style="font-size: 14px; color: var(--text-sub);">Loading your surprise...</p>
    </div>

    <div id="screen-passcode" class="hidden">
      <div class="pass-header">
        <p style="font-size: 28px;">✨🌻✨</p>
        <h2 style="font-size: 20px;">For You, Al Sayang</h2>
        <p style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Enter the secret code</p>
      </div>

      <div class="pass-dots">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
        <div class="dot" id="dot-4"></div>
        <div class="dot" id="dot-5"></div>
      </div>

      <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" onclick="pressKey('C')">✕</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="pressKey('OK')">↵</button>
      </div>

      <div id="error-msg" class="error-msg"></div>
      <p style="margin-top: 20px; font-size: 13px; color: var(--text-sub);">Hint: 0
