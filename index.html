<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Al Sayang ♡</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#09060b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,#8d397040,transparent 30%),
    radial-gradient(circle at 80% 80%,#5e318040,transparent 35%);
  pointer-events:none
}

.page{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:25px 18px;
  position:relative
}
.page.active{display:flex}

.card{
  width:min(650px,100%);
  padding:28px 22px;
  border-radius:28px;
  background:#ffffff0d;
  border:1px solid #ffffff20;
  backdrop-filter:blur(15px);
  box-shadow:0 20px 80px #0008
}

h1,h2{
  font-family:Georgia,serif;
  font-weight:500
}

.pink{color:#f3a6d0}

.btn{
  margin-top:20px;
  border:0;
  border-radius:50px;
  padding:13px 24px;
  background:linear-gradient(135deg,#f5afd4,#b96ca9);
  color:#260b20;
  font-weight:bold;
  cursor:pointer
}

.flower{
  position:fixed;
  font-size:30px;
  animation:float 4s infinite ease-in-out;
  pointer-events:none
}
.f1{top:8%;left:8%}
.f2{top:25%;right:7%}
.f3{bottom:12%;left:8%}
.f4{bottom:20%;right:10%}

.spark{
  position:fixed;
  color:white;
  animation:spark 2s infinite;
  pointer-events:none
}
@keyframes spark{
  50%{opacity:.15;transform:scale(.5)}
}
@keyframes float{
  50%{transform:translateY(-12px) rotate(8deg)}
}

#passwordPage{text-align:center}

.lockFlower{
  font-size:55px;
  margin-bottom:15px;
  animation:float 2.5s infinite
}

.lockTitle{font-size:35px}
.lockText{
  color:#cdbccd;
  font-size:13px;
  line-height:1.7;
  margin-top:12px
}

input{
  width:min(280px,90%);
  margin-top:20px;
  padding:15px;
  border-radius:15px;
  border:1px solid #ffffff25;
  background:#ffffff0b;
  color:white;
  outline:none;
  text-align:center;
  letter-spacing:5px
}

#error{
  height:20px;
  margin-top:8px;
  color:#f19ac8;
  font-size:12px
}

.hero{text-align:center}
.heroCake{font-size:60px}
.hero h1{
  font-size:54px;
  line-height:.95;
  margin-top:12px
}
.subtitle{
  margin-top:20px;
  color:#d8cbd8;
  font-family:Georgia,serif;
  font-size:19px
}

.line{
  width:90px;
  height:1px;
  margin:20px auto;
  background:linear-gradient(90deg,transparent,#efa7cf,transparent)
}

.small{
  color:#978798;
  font-size:10px;
  letter-spacing:2px;
  margin-top:25px
}

.kicker{
  text-align:center;
  text-transform:uppercase;
  letter-spacing:3px;
  color:#c59abb;
  font-size:10px;
  margin-bottom:8px
}

.title{
  text-align:center;
  font-size:38px;
  margin-bottom:20px
}

.letter{
  white-space:pre-line;
  color:#eaddea;
  font-family:Georgia,serif;
  font-size:18px;
  line-height:1.7
}

.signature{
  margin-top:25px;
  text-align:right;
  color:#f1afd1;
  font-family:Georgia,serif;
  font-size:21px
}

.photos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.photos img{
  width:100%;
  aspect-ratio:1/1.2;
  object-fit:cover;
  border-radius:18px;
  border:1px solid #ffffff20
}

.caption{
  text-align:center;
  color:#f2a8ce;
  font-family:Georgia,serif;
  font-size:23px;
  margin-top:16px
}

.final{
  text-align:center;
  margin-top:35px
}

.final h2{
  font-size:35px
}

.final p{
  color:#ad9eae;
  font-size:12px;
  margin-top:10px
}

.music{
  position:fixed;
  bottom:15px;
  right:15px;
  z-index:50;
  display:none;
  background:#180c18dd;
  border:1px solid #ffffff20;
  padding:9px 13px;
  border-radius:50px;
  backdrop-filter:blur(10px);
  font-size:11px
}

.music button{
  border:0;
  background:none;
  color:white;
  margin-left:7px;
  cursor:pointer
}

@media(max-width:450px){
  .hero h1{font-size:47px}
  .title{font-size:34px}
  .letter{font-size:17px}
}
</style>
</head>

<body>

<!-- ORNAMEN -->
<div class="flower f1">🌻</div>
<div class="flower f2">🌻</div>
<div class="flower f3">🌻</div>
<div class="flower f4">🌻</div>

<div class="spark" style="top:15%;left:25%">✦</div>
<div class="spark" style="top:32%;right:22%">✦</div>
<div class="spark" style="top:70%;left:17%">✦</div>
<div class="spark" style="bottom:18%;right:25%">✦</div>


<!-- PASSWORD -->
<section id="passwordPage" class="page active">

  <div class="lockFlower">🌻</div>

  <h1 class="lockTitle">
    A little surprise<br>
    <span class="pink">for Al ♡</span>
  </h1>

  <p class="lockText">
    Ada sesuatu yang Aca siapin buat Al.<br>
    Masukin password dulu ya sayang.
  </p>

  <input
    id="pass"
    type="password"
    maxlength="6"
    inputmode="numeric"
    placeholder="••••••"
  >

  <button class="btn" onclick="openGift()">
    Open my surprise ♡
  </button>

  <div id="error"></div>

</section>


<!-- HOME -->
