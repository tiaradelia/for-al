<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>For Al Sayang ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

:root{
  --bg:#12081b;
  --pink:#f4a8d0;
  --pink2:#ffd1e7;
  --lav:#c9b2ff;
  --gold:#ffd76a;
  --white:#fff8fc;
  --muted:#cdbed0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#0c0610;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

#app{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(232,117,187,.18),transparent 30%),
    radial-gradient(circle at 90% 30%,rgba(147,111,255,.13),transparent 30%),
    linear-gradient(150deg,#110717,#1d0b27 55%,#0e0714);
}

.screen{
  display:none;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.screen.active{
  display:flex;
}

.center{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.inner{
  width:min(92vw,650px);
  margin:auto;
  padding:42px 18px 90px;
  position:relative;
  z-index:3;
}

.eyebrow{
  font-size:.72rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--pink2);
}

h1,h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
}

h1{
  line-height:.95;
}

.glow{
  text-shadow:0 0 20px rgba(244,168,208,.25);
}

.small{
  font-size:.8rem;
  color:var(--muted);
}

.btn{
  border:1px solid rgba(255,210,232,.25);
  color:white;
  background:
    linear-gradient(
      135deg,
      rgba(255,183,220,.2),
      rgba(174,142,255,.14)
    );
  padding:14px 22px;
  border-radius:999px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.primary{
  background:linear-gradient(135deg,#d67db4,#9d80e7);
}


/* SPARK */

.spark-field,
.flower-field,
.confetti-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}

.spark{
  position:absolute;
  top:-30px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff8d8;
  box-shadow:0 0 8px 2px #ffd6ef;
  animation:fall linear infinite;
}

.spark:nth-child(3n){
  width:2px;
  height:8px;
  transform:rotate(45deg);
}

@keyframes fall{
  to{
    transform:
      translate3d(40px,110vh,0)
      rotate(180deg);
    opacity:.1;
  }
}


/* SUNFLOWER */

.sunflower{
  position:absolute;
  font-size:clamp(32px,7vw,64px);
  filter:drop-shadow(0 0 14px rgba(255,201,74,.25));
  animation:float 4s ease-in-out infinite;
}

.s1{
  left:-4px;
  top:9%;
  transform:rotate(-16deg);
}

.s2{
  right:-4px;
  top:21%;
  transform:rotate(14deg);
  animation-delay:1s;
}

.s3{
  left:5%;
  bottom:8%;
  animation-delay:2s;
}

.s4{
  right:5%;
  bottom:12%;
  animation-delay:.5s;
}

@keyframes float{
  50%{
    transform:translateY(-9px) rotate(2deg);
  }
}


/* PASSWORD */

.lock-card{
  width:min(88vw,410px);
  padding:38px 25px 30px;
  border-radius:32px;
  background:rgba(40,18,52,.72);
  border:1px solid rgba(255,210,235,.14);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.45);
}

.lock-heart{
  font-size:44px;
  margin-bottom:10px;
  animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
  50%{
    transform:scale(1.08);
  }
}

.lock-card h1{
  font-size:42px;
  margin:8px 0;
}

.pin-display{
  height:45px;
  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;
  margin:18px 0;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#6d5a70;
}

.dot.on{
  background:var(--pink2);
  box-shadow:0 0 12px var(--pink);
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.key{
  height:55px;
  border:0;
  border-radius:17px;
  background:rgba(255,255,255,.065);
  color:white;
  cursor:pointer;
  font-size:1rem;
}

.key:active{
  transform:scale(.95);
}

.error{
  height:20px;
  color:#ffb3d8;
  font-size:.76rem;
}


/* WELCOME */

.photo-orbit{
  width:min(72vw,330px);
  height:min(72vw,330px);
  margin:0 auto 30px;
  position:relative;
}

.photo-orbit:before{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(255,205,230,.2);
  border-radius:50%;
}

.photo-orbit img{
  width:70%;
  height:85%;
  object-fit:cover;
  position:absolute;
  left:15%;
  top:7%;
  border-radius:48%;
  border:5px solid rgba(255,255,255,.12);
  box-shadow:0 25px 70px rgba(0,0,0,.5);
  transform:rotate(3deg);
}

.welcome-title{
  font-size:clamp(62px,16vw,108px);
  margin:15px 0 12px;
}

.welcome-sub{
  font-family:'Cormorant Garamond';
  font-size:clamp(21px,5vw,29px);
  color:#efd8e9;
}


/* BIRTHDAY */

.birthday h1{
  font-size:clamp(52px,14vw,94px);
  margin-bottom:10px;
}

.name{
  font-size:clamp(46px,12vw,82px);
  color:var(--pink2);
  font-style:italic;
}

.quote{
  font-family:'Cormorant Garamond';
  font-size:1.25rem;
  color:#e5d3e2;
  line-height:1.5;
  max-width:560px;
  margin:26px auto;
}


/* CARD */

.card{
  background:rgba(33,15,44,.66);
  border:1px solid rgba(255,214,235,.13);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 25px 80px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}

.letter-title{
  font-size:clamp(45px,11vw,72px);
  margin:10px 0;
}

.letter{
  font-family:'Cormorant Garamond';
  font-size:1.2rem;
  line-height:1.72;
  text-align:left;
  color:#f5e7f0;
}

.letter p{
  margin-bottom:18px;
}

.signature{
  text-align:right;
  font-size:1.35rem;
  color:var(--pink2);
  font-style:italic;
}


/* GALLERY */

.gallery{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:24px;
}

.gallery figure{
  margin:0;
}

.gallery img{
  width:100%;
  height:270px;
  object-fit:cover;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 15px 45px rgba(0,0,0,.28);
}

.gallery figure:first-child img{
  transform:rotate(-2deg);
}

.gallery figure:last-child img{
  transform:rotate(2deg);
}

.gallery figcaption{
  text-align:center;
  margin-top:10px;
  color:var(--pink2);
  font-family:'Cormorant Garamond';
  font-size:1.2rem;
}


/* MUSIC */

.music-fab{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:30;
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(34,15,45,.82);
  color:white;
  cursor:pointer;
}

.music-panel{
  position:fixed;
  right:18px;
  bottom:78px;
  width:min(88vw,360px);
  z-index:31;
  background:rgba(25,11,34,.96);
  border:1px solid rgba(255,210,232,.14);
  border-radius:24px;
  padding:16px;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  display:none;
}

.music-panel.open{
  display:block;
}

.track{
  width:100%;
  text-align:left;
  padding:12px;
  border-radius:14px;
  border:1px solid transparent;
  background:rgba(255,255,255,.05);
  color:white;
  cursor:pointer;
  margin-top:8px;
}

.track.active{
  border-color:rgba(244,168,208,.45);
  background:rgba(244,168,208,.11);
}

.player{
  width:100%;
  height:80px;
  border-radius:14px;
  overflow:hidden;
  margin-top:10px;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}


/* NAV */

.nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:28px;
}


/* CONFETTI */

.confetti{
  position:absolute;
  width:8px;
  height:13px;
  top:50%;
  left:50%;
  opacity:0;
  border-radius:2px;
}

.confetti.burst{
  animation:burst 1.4s cubic-bezier(.1,.75,.2,1) forwards;
}

@keyframes burst{
  0%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      rotate(0);
  }

  100%{
    opacity:0;
    transform:
      translate(var(--x),var(--y))
      rotate(var(--r));
  }
}


@media(max-width:520px){

  .inner{
    padding-top:34px;
  }

  .gallery img{
    height:250px;
  }

  .card{
    padding:23px 18px;
  }

  .letter{
    font-size:1.13rem;
  }

}
</style>
</head>

<body>

<div id="app">


<!-- PASSWORD -->

<section id="lock" class="screen active center">

  <div class="spark-field" id="sparksLock"></div>

  <div class="flower-field">

    <div class="sunflower s1">🌻</div>
    <div class="sunflower s2">🌻</div>
    <div class="sunflower s3">🌻</div>
    <div class="sunflower s4">🌻</div>

  </div>

  <div class="lock-card">

    <div class="lock-heart">♡</div>

    <div class="eyebrow">
      a little surprise
    </div>

    <h1>
      For Al Sayang
    </h1>

    <p class="small">
      masukkan tanggal yang punya arti ♡
    </p>

    <div class="pin-display" id="pinDisplay"></div>

    <div class="keypad">

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>

      <button class="key" data-key="clear">×</button>
      <button class="key" data-key="0">0</button>
      <button class="key" data-key="back">⌫</button>

    </div>

    <div class="error" id="pinError"></div>

    <p class="small">
      hint: 010524
